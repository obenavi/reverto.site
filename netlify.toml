[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install && npm install --prefix netlify/functions/market/sync"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/js/*.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/css/*.css"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/onboarding"
  to = "/onboarding.html"
  status = 200

[[redirects]]
  from = "/invoice"
  to = "/invoice.html"
  status = 200

[[redirects]]
  from = "/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/auth/signup"
  to = "/.netlify/functions/auth-signup"
  status = 200

[[redirects]]
  from = "/invoices/list"
  to = "/.netlify/functions/invoices/list"
  status = 200

[[redirects]]
  from = "/invoices/upload"
  to = "/.netlify/functions/invoices/upload"
  status = 200

[[redirects]]
  from = "/invoices/parse"
  to = "/.netlify/functions/invoices/parse"
  status = 200

# Page route — MUST stay after the /invoices/* function routes above so it
# doesn't shadow them (Netlify matches top-down).
[[redirects]]
  from = "/invoices"
  to = "/invoices.html"
  status = 200

[[redirects]]
  from = "/sales/save"
  to = "/.netlify/functions/sales/save"
  status = 200

[[redirects]]
  from = "/sales/report"
  to = "/.netlify/functions/sales/report"
  status = 200

[[redirects]]
  from = "/sales"
  to = "/sales.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

# CCPA data-rights function routes. Kept before any page route so they are not
# shadowed (Netlify matches top-down). There is no /data page route.
[[redirects]]
  from = "/data/export"
  to = "/.netlify/functions/data/export"
  status = 200

[[redirects]]
  from = "/data/delete"
  to = "/.netlify/functions/data/delete"
  status = 200

# Public legal pages + the authenticated account page.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/account"
  to = "/account.html"
  status = 200

# New shell page routes (placeholder pages reachable from the bottom nav).
[[redirects]]
  from = "/market"
  to = "/market.html"
  status = 200

[[redirects]]
  from = "/vendors"
  to = "/vendors.html"
  status = 200

[[redirects]]
  from = "/recipes"
  to = "/recipes.html"
  status = 200

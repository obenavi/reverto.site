[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install --prefix netlify/functions/auth && npm install --prefix netlify/functions/market/sync"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/js/*.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/css/*.css"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/onboarding"
  to = "/onboarding.html"
  status = 200

[[redirects]]
  from = "/invoice"
  to = "/invoice.html"
  status = 200

[[redirects]]
  from = "/auth/login"
  to = "/.netlify/functions/auth/login"
  status = 200

[[redirects]]
  from = "/auth/signup"
  to = "/.netlify/functions/auth/signup"
  status = 200

[[redirects]]
  from = "/invoices/list"
  to = "/.netlify/functions/invoices/list"
  status = 200

[[redirects]]
  from = "/invoices/upload"
  to = "/.netlify/functions/invoices/upload"
  status = 200

[[redirects]]
  from = "/invoices/parse"
  to = "/.netlify/functions/invoices/parse"
  status = 200

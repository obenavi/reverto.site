name: Push Notifications

on:
  workflow_dispatch:   # Manual only until VAPID keys are configured in Netlify
  # schedule:
  #   - cron: '0 * * * *'   # Every hour — re-enable after VAPID keys set

jobs:
  send-push:
    name: Send scheduled push notifications
    runs-on: ubuntu-latest
    steps:
      - name: Trigger send-push function
        run: |
          curl -f -s -X POST \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NETLIFY_URL }}/api/push/send"

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Yield</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
<main class="auth-card card">
  <a class="logo brand" href="/">Yield</a>
  <h1>Log in</h1>

  <div id="error" class="form-error hidden" role="alert"></div>

  <form id="login-form" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-block btn-lg" id="submit">Log in</button>
  </form>

  <p class="auth-alt">No account yet? <a href="/signup">Create one</a></p>
</main>

<script src="/js/db.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
